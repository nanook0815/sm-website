<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration: Storyboard-Karten für die Konzept- und Planungsphase">
  <defs>
    <radialGradient id="glow" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#C08E52" stop-opacity="0.16" />
      <stop offset="55%" stop-color="#C08E52" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#C08E52" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="#1B1D1C" />
  <rect width="800" height="600" fill="url(#glow)" />

  <!-- feine Rasterpunkte als Textur -->
  <g fill="#FDFBF7" opacity="0.05">
    <circle cx="80" cy="90" r="2.5" />
    <circle cx="140" cy="90" r="2.5" />
    <circle cx="200" cy="90" r="2.5" />
    <circle cx="80" cy="140" r="2.5" />
    <circle cx="140" cy="140" r="2.5" />
    <circle cx="200" cy="140" r="2.5" />
    <circle cx="620" cy="480" r="2.5" />
    <circle cx="680" cy="480" r="2.5" />
    <circle cx="740" cy="480" r="2.5" />
    <circle cx="620" cy="530" r="2.5" />
    <circle cx="680" cy="530" r="2.5" />
    <circle cx="740" cy="530" r="2.5" />
  </g>

  <!-- Sequenz-Pfad zwischen den Storyboard-Karten -->
  <path
    d="M 245 290 C 320 250, 380 250, 400 250 C 430 250, 480 260, 550 300"
    fill="none"
    stroke="#C08E52"
    stroke-width="2.5"
    stroke-dasharray="2 10"
    stroke-linecap="round"
    opacity="0.85"
  />
  <path d="M 550 300 l -14 -8 m 14 8 l -6 14" fill="none" stroke="#C08E52" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Karte 1 -->
  <g transform="rotate(-9 235 300)">
    <rect x="140" y="230" width="190" height="140" rx="10" fill="#242724" stroke="#DAD5CB" stroke-opacity="0.25" stroke-width="1.5" />
    <rect x="158" y="248" width="154" height="82" rx="6" fill="#1B1D1C" />
    <path d="M 218 268 l 34 21 l -34 21 z" fill="#C08E52" opacity="0.9" />
    <line x1="158" y1="344" x2="252" y2="344" stroke="#FDFBF7" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round" />
    <line x1="158" y1="354" x2="212" y2="354" stroke="#FDFBF7" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Karte 2 (Mitte, vorne) -->
  <g transform="rotate(2 405 268)">
    <rect x="310" y="196" width="190" height="140" rx="10" fill="#2A2D2A" stroke="#C08E52" stroke-opacity="0.55" stroke-width="1.75" />
    <rect x="328" y="214" width="154" height="82" rx="6" fill="#1B1D1C" />
    <path d="M 388 234 l 34 21 l -34 21 z" fill="#C08E52" />
    <line x1="328" y1="310" x2="440" y2="310" stroke="#FDFBF7" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round" />
    <line x1="328" y1="320" x2="400" y2="320" stroke="#FDFBF7" stroke-opacity="0.22" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Karte 3 -->
  <g transform="rotate(10 565 320)">
    <rect x="470" y="250" width="190" height="140" rx="10" fill="#242724" stroke="#DAD5CB" stroke-opacity="0.25" stroke-width="1.5" />
    <rect x="488" y="268" width="154" height="82" rx="6" fill="#1B1D1C" />
    <path d="M 548 288 l 34 21 l -34 21 z" fill="#C08E52" opacity="0.9" />
    <line x1="488" y1="364" x2="582" y2="364" stroke="#FDFBF7" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round" />
    <line x1="488" y1="374" x2="542" y2="374" stroke="#FDFBF7" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Stift unten links -->
  <g transform="translate(120 470) rotate(-38)">
    <rect x="0" y="0" width="132" height="14" rx="7" fill="#FDFBF7" opacity="0.85" />
    <path d="M 132 0 L 152 7 L 132 14 Z" fill="#C08E52" />
    <rect x="0" y="0" width="18" height="14" rx="7" fill="#9A6F3F" />
  </g>
</svg>
